name: Bug report
description: Report a reproducible AI Drawer application defect without provider or account data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, responses, page content, full URLs, account identifiers, credentials, cookies, tokens, payment details, or private security findings. Provider website behavior and AI Drawer native-shell defects are different evidence categories.
  - type: input
    id: version
    attributes:
      label: AI Drawer version or commit
      placeholder: Tag, release name, or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and architecture
      placeholder: Windows 11 24H2, x64
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Native window, tray, or shortcut
        - Workspace lifecycle or recovery
        - Navigation or popup boundary
        - Permission or download handling
        - Packaging, installation, or update
        - Provider-owned website behavior
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Sanitized reproduction steps
      description: Describe native actions and visible outcomes only. Replace any provider URL with its origin or a fictional example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed prompts, responses, page content, sensitive URLs, account data, credentials, cookies, tokens, payment data, and private security details.
          required: true
