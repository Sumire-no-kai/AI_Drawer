name: Internal Beta candidate (unsigned)

on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: Short internal label (letters, numbers, dots, underscores, and hyphens)
        required: true
        type: string
      architecture:
        description: Package architecture
        required: true
        default: x64
        type: choice
        options:
          - x64
          - x86
          - arm64
      dependency_mode:
        description: Runtime dependency model
        required: true
        default: FrameworkDependent
        type: choice
        options:
          - FrameworkDependent
          - SelfContained

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build and validate internal candidate
        shell: pwsh
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          CANDIDATE_ARCHITECTURE: ${{ inputs.architecture }}
          CANDIDATE_DEPENDENCY_MODE: ${{ inputs.dependency_mode }}
          CANDIDATE_OUTPUT_ROOT: ${{ runner.temp }}/ai-drawer-beta-candidates
        run: ./tools/Build-InternalBetaCandidate.ps1 -CandidateLabel $env:CANDIDATE_LABEL -Architecture $env:CANDIDATE_ARCHITECTURE -DependencyMode $env:CANDIDATE_DEPENDENCY_MODE -OutputRoot $env:CANDIDATE_OUTPUT_ROOT

      - name: Upload internal candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-drawer-internal-${{ inputs.candidate_label }}-${{ inputs.architecture }}-${{ inputs.dependency_mode }}
          path: ${{ runner.temp }}/ai-drawer-beta-candidates/${{ inputs.candidate_label }}
          if-no-files-found: error
          retention-days: 14
